server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects stay relative to the incoming host/scheme (TLS is terminated by the Coolify proxy)
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml text/xml text/plain image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # www → apex (one canonical host)
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }

    error_page 404 /404.html;

    # Hashed build assets — cache forever
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|webp|ico|svg|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        # Canonical URLs have NO trailing slash (same as the URLs Google already indexed):
        #   /barrel-sauna/            → 301 /barrel-sauna
        #   /barrel-sauna/index.html  → 301 /barrel-sauna
        #   /index.html               → 301 /
        # $request_uri is the ORIGINAL request, so internal lookups never loop.
        if ($request_uri ~ "^/index\.html(\?.*)?$") { return 301 /$1; }
        if ($request_uri ~ "^(/.+)/index\.html(\?.*)?$") { return 301 $1$2; }
        if ($request_uri ~ "^(/.+)/(\?.*)?$") { return 301 $1$2; }

        try_files $uri $uri/index.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
